[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quantum-chaos"
version = "0.2.0.dev0"
description = "Quantum chaos and information scrambling in SYK and Hubbard models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "pennylane>=0.45,<0.46",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.urls]
Repository = "https://github.com/rasidi3112/quantum-chaos-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_chaos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not slow"]
xfail_strict = true
filterwarnings = [
    "error::pennylane.exceptions.PennyLaneDeprecationWarning",
    "error:Glyph .* missing from font:UserWarning",
]
markers = [
    "slow: long-running statistical tests, skipped by default (run with '-m slow')",
]
